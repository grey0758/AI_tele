[pytest]
# 测试发现路径
testpaths = tests
# 测试文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# 添加项目根目录到Python路径
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
# 异步测试配置
asyncio_mode = auto
# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试
    websocket: WebSocket相关测试
    asyncio: 异步测试
    audio_required: 需要音频设备的测试
